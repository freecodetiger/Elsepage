name: ReadLoop
options:
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.readloop.reader
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Reader
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    INFOPLIST_KEY_UISupportsDocumentBrowser: NO
    INFOPLIST_KEY_UTImportedTypeDeclarations: []
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ReadLoopCore:
    path: .
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.3.0
targets:
  ReadLoop:
    type: application
    platform: iOS
    productName: Reader
    sources:
      - path: App
    dependencies:
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: ReaderCore
      - package: ReadLoopCore
        product: ReadingSessionCore
      - package: ReadLoopCore
        product: ReflectionCore
      - package: ReadLoopCore
        product: AgentCore
      - package: ReadLoopCore
        product: ModelProviders
      - package: ReadLoopCore
        product: Persistence
      - package: ReadLoopCore
        product: AppInfrastructure
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
    settings:
      base:
        PRODUCT_MODULE_NAME: ReadLoop
        DEVELOPMENT_TEAM: U6Y3X5W7T2
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ReadLoopCoreTests
        - ReadiumIntegrationTests
  ReadLoopCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReadLoopCoreTests
    dependencies:
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: ReaderCore
      - package: ReadLoopCore
        product: ReadingSessionCore
      - package: ReadLoopCore
        product: ReflectionCore
      - package: ReadLoopCore
        product: Persistence
      - package: ReadLoopCore
        product: AppInfrastructure
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReadiumIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: ReadLoop
    sources:
      - path: Tests/ReadiumIntegrationTests
      - path: Tests/ReadLoopCoreTests/Fixtures/EPUB/minimal.epub
        buildPhase: resources
    dependencies:
      - target: ReadLoop
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: AppInfrastructure
      - package: ReadLoopCore
        product: Persistence
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
