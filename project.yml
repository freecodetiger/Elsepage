name: ReadLoop
options:
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.readloop.reader
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 页外
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录下你的阅读感想并在本机转写。"
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于把你的语音感想转成可编辑文字。"
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
    INFOPLIST_KEY_UISupportsDocumentBrowser: NO
    INFOPLIST_KEY_UTImportedTypeDeclarations: []
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ReadLoopCore:
    path: .
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.3.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  ReadLoop:
    type: application
    platform: iOS
    productName: Reader
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: 页外
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "用于录下你的阅读感想并在本机转写。"
        NSSpeechRecognitionUsageDescription: "用于把你的语音感想转成可编辑文字。"
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB 电子书
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.idpf.epub-container
              - public.epub
    sources:
      - path: App
    dependencies:
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: ReaderCore
      - package: ReadLoopCore
        product: ReadingSessionCore
      - package: ReadLoopCore
        product: ReflectionCore
      - package: ReadLoopCore
        product: SpeechCore
      - package: ReadLoopCore
        product: RetrievalCore
      - package: ReadLoopCore
        product: AgentRuntime
      - package: ReadLoopCore
        product: ContextRouting
      - package: ReadLoopCore
        product: ContextEngineering
      - package: ReadLoopCore
        product: ReaderAgent
      - package: ReadLoopCore
        product: ModelProviders
      - package: ReadLoopCore
        product: Persistence
      - package: ReadLoopCore
        product: AppInfrastructure
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumAdapterGCDWebServer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_MODULE_NAME: ReadLoop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: U6Y3X5W7T2
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - ReadLoopCoreTests
        - ReadiumIntegrationTests
  ReadLoopCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReadLoopCoreTests
    dependencies:
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: ReaderCore
      - package: ReadLoopCore
        product: ReadingSessionCore
      - package: ReadLoopCore
        product: ReflectionCore
      - package: ReadLoopCore
        product: SpeechCore
      - package: ReadLoopCore
        product: RetrievalCore
      - package: ReadLoopCore
        product: AgentRuntime
      - package: ReadLoopCore
        product: ContextRouting
      - package: ReadLoopCore
        product: ContextEngineering
      - package: ReadLoopCore
        product: ReaderAgent
      - package: ReadLoopCore
        product: Persistence
      - package: ReadLoopCore
        product: AppInfrastructure
      - package: GRDB
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ReadiumIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: ReadLoop
    sources:
      - path: Tests/ReadiumIntegrationTests
      - path: Tests/ReadLoopCoreTests/Fixtures/EPUB/minimal.epub
        buildPhase: resources
    dependencies:
      - target: ReadLoop
      - package: ReadLoopCore
        product: LibraryCore
      - package: ReadLoopCore
        product: ReaderCore
      - package: ReadLoopCore
        product: AppInfrastructure
      - package: ReadLoopCore
        product: Persistence
      - package: ReadLoopCore
        product: RetrievalCore
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReadLoop.app/ReadLoop"
        BUNDLE_LOADER: "$(TEST_HOST)"
