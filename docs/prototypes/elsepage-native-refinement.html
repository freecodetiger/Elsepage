<!doctype html>
<!-- THROWAWAY: native-first refinement of layout study 1. Static, no JS.
     System text sizes are CSS references, not Dynamic Type validation. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页外 · 书架原生收敛</title>
<style>
:root{
  --bg:#f2f2f2;
  --label:#111111;
  --secondary:#666666;
  --tertiary:#6e6e6e;
  --separator:#d4d4d4;
  --fill:rgba(118,118,128,.12);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f5f5f3;color:var(--label);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{cursor:default}

.page-head{max-width:876px;margin:0 auto;padding:44px 24px 0}
.page-head h1{font-size:20px;font-weight:600;line-height:28px}
.page-head p{font-size:13px;line-height:20px;color:var(--secondary);margin-top:4px}

.study{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start;padding:28px 24px 8px}
.frame{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.frame figcaption{font-size:13px;line-height:18px;color:var(--secondary);text-align:center}

.phone{
  position:relative;width:393px;height:852px;flex:none;display:flex;flex-direction:column;
  border-radius:54px;overflow:hidden;background:var(--bg);color:var(--label);
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05),0 32px 64px -24px rgba(0,0,0,.28);
}

/* System chrome: status bar, Dynamic Island, tab bar, home indicator. */
.status{position:relative;height:59px;flex:none;padding:17px 30px 0 31px;display:flex;justify-content:space-between;align-items:flex-start}
.time{font-size:17px;font-weight:600;line-height:21px;letter-spacing:0}
.status-icons{display:block;height:13px;margin-top:2px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:19px;background:#000}

.nav{flex:none}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.nav-leading{display:flex;align-items:center}
.nav-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--label)}
.nav-btn svg,.tab svg,.search svg,.prompt svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.large-title{padding:0 16px;height:52px;display:flex;align-items:center;font-size:34px;font-weight:700;line-height:41px;letter-spacing:0}

.search{margin:0 16px 12px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--secondary)}
.search span{font-size:17px;line-height:22px}

.content{flex:1;overflow:auto;scrollbar-width:none;padding:0 0 107px}
.content::-webkit-scrollbar{display:none}

.section-title{font-size:20px;font-weight:600;line-height:25px;margin:8px 16px 12px}
.section-title--grid{margin-top:32px}

.current{position:relative;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;padding:0 16px}
.current .cover{height:180px}
.current-copy{min-width:0}
.current-title{font-size:22px;font-weight:600;line-height:28px}
.current-author{font-size:15px;line-height:20px;color:var(--secondary);margin-top:2px}
.progress{margin-top:16px;height:4px;border-radius:2px;background:rgba(120,120,128,.16);overflow:hidden}
.progress span{display:block;height:100%;border-radius:2px;background:var(--label)}
.progress-label{font-size:13px;line-height:18px;color:var(--secondary);margin-top:6px}
.numeric{font-variant-numeric:tabular-nums}

.prompt{height:30px;padding:0 12px;border-radius:15px;background:var(--fill);color:var(--label);display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:15px;font-weight:600;line-height:20px}
.prompt svg{width:13px;height:13px;stroke-width:2.1}
.prompt--overlay{position:absolute;right:32px;bottom:0}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px;row-gap:24px;padding:0 16px}
.cell{min-width:0}
.cell-title{font-size:15px;font-weight:600;line-height:20px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell-author{font-size:13px;line-height:18px;color:var(--secondary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:4px;overflow:hidden;padding:12px;display:flex;flex-direction:column;justify-content:space-between;background:var(--paper);color:var(--ink);box-shadow:0 0 0 .5px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.10),0 6px 16px rgba(0,0,0,.07)}
.cover-title{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.34;letter-spacing:0}
.cover-author{font-family:var(--sans);font-size:9px;line-height:12px;opacity:.62}
.paper-1{--paper:#33413a;--ink:#f1ede4}
.paper-2{--paper:#435c6b;--ink:#edeae1}
.paper-3{--paper:#7c5343;--ink:#f3e9e0}
.paper-4{--paper:#4f5941;--ink:#efeddf}
.paper-5{--paper:#4b4c58;--ink:#edebe4}
.paper-6{--paper:#5b494d;--ink:#f0e8e3}

.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:2;height:83px;padding:6px 22px 0;display:flex;justify-content:space-between;background:rgba(249,249,249,.88);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--separator)}
.tab{width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tertiary);font-size:10px;font-weight:500;line-height:12px}
.tab svg{width:25px;height:25px;stroke-width:1.7}
.tab.active{color:var(--label)}
.tab.active svg{stroke-width:1.9}
.home{position:absolute;z-index:3;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000}

.note{max-width:876px;margin:0 auto;padding:14px 24px 40px;font-size:13px;line-height:20px;color:var(--secondary)}
.note b{font-weight:600;color:var(--label)}

@media (max-width:880px){
  .page-head{padding-top:28px}
  .study{gap:28px;padding-left:12px;padding-right:12px}
}
@media (max-width:430px){
  .page-head{padding:24px 20px 0}
  .study{padding:20px 0 0}
  .phone{zoom:.88}
  .note{padding-left:20px;padding-right:20px}
}
@media (max-width:350px){
  .phone{zoom:.78}
}
</style>
</head>
