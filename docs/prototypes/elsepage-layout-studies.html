 '1':{name:'原生大字',description:'明确的标题、充足的操作面积。当前阅读横向排列，其他书使用双列封面。',scale:['36','26','17','14–16'],spacing:'页边距24 · 组件间隔24/32 · 按钮高52',tradeoff:'首选方向。保留 iOS 的熟悉感，也给书名和封面足够分量。'},
 '2':{name:'编辑目录',description:'以书名组织秩序。取消独立阅读卡片，书目在同一条对齐基线上展开。',scale:['40','30','17','14–16'],spacing:'页边距24 · 书目间隔26 · 按钮高52',tradeoff:'更有编辑感，扫描书名直接；封面让出一部分视觉权重。'},

const query=new URLSearchParams(location.search);
const state={variant:plans[query.get('variant')]?query.get('variant'):'1',page:'library',active:books[0],searchOpen:false,query:'',sortByName:false,draft:'',reflections:[]};

function progress(b){return `<div class="progress"><div class="track"><span style="width:${b.progress}%"></span></div><span class="numeric">${b.progress}%</span></div>`}
function actions(){return `<div class="actions"><button class="action" data-action="read" data-book="${state.active.id}">${icon('book')}继续阅读</button><button class="action secondary" data-action="reflect">${icon('pen')}补写想法</button></div>`}
function collectionHeading(name='我的书架'){return `<div class="section-title"><h2>${name}</h2><button data-action="sort" aria-label="切换书架排序">${icon('sort')}${state.sortByName?'书名':'最近'}</button></div>`}
function filtered(){const result=books.filter(b=>(b.name+b.author).includes(state.query));return state.sortByName?[...result].sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')):result}
function grid(items){return `<div class="collection">${items.map(b=>`<article class="collection-item">${cover(b)}<h3>${b.name}</h3><p>${b.author}</p></article>`).join('')}</div>`}
function native(){const items=filtered();return `<div class="screen-page">${header()}${search()}<div class="inset">${state.query?items.length?grid(items):'<p class="empty">没有找到这本书</p>':`<section class="native-current">${cover(state.active)}<div><h2 class="book-title">${state.active.name}</h2><p class="metadata">${state.active.author}</p><p class="chapter">${state.active.chapter}</p>${progress(state.active)}</div></section>${actions()}${collectionHeading()}${grid(items.filter(b=>b.id!==state.active.id))}`}</div></div>`}
function directory(){const items=filtered();return `<div class="screen-page">${header()}${search()}<div class="inset"><div class="directory-filter"><span>${items.length} 本书</span><button data-action="sort">${state.sortByName?'按书名':'最近阅读'}${icon('down')}</button></div>${!items.length?'<p class="empty">没有找到这本书</p>':items.map(b=>`<article class="directory-row ${b.id===state.active.id?'current':''}"><div class="directory-body">${cover(b,'directory-cover')}<button class="directory-name" data-action="read" data-book="${b.id}"><h2>${b.name}</h2><p class="metadata">${b.author}</p>${b.id===state.active.id?progress(b):`<p class="reading-position">${b.progress?b.chapter+' · '+b.progress+'%':'尚未开始'}</p>`}</button>${b.id!==state.active.id?icon('right'):''}</div>${b.id===state.active.id?actions():''}</article>`).join('')}</div></div>`}
function focus(){const items=filtered();return `<div class="screen-page">${header()}${search()}${state.query?`<div class="inset">${items.length?grid(items):'<p class="empty">没有找到这本书</p>'}</div>`:`<section class="focus-plate">${cover(state.active,'focus-cover')}<div class="focus-caption"><h2>${state.active.name}</h2><p>${state.active.author}</p><div class="focus-bottom"><span>${state.active.chapter}</span><i></i><span class="numeric">${state.active.progress}%</span></div></div></section><div class="focus-actions">${actions()}</div><div class="inset">${collectionHeading()}<div class="focus-collection">${items.filter(b=>b.id!==state.active.id).map(b=>`<article class="focus-collection-item">${cover(b)}<h3>${b.name}</h3><p>${b.author}</p></article>`).join('')}</div></div>`}</div>`}
function reader(){return `<div class="reader-content"><div class="reader-bar"><button class="icon-button" data-action="library" aria-label="返回书架">${icon('left')}</button><span>${state.active.name}</span><button class="icon-button" data-action="reflect" aria-label="留下想法">${icon('pen')}</button></div><h1>留白的意义</h1><p>我们习惯用完成了多少事情，来衡量一天是否值得。于是，连安静的片刻，也急着安排一个用途。</p><blockquote>给思考留出空间，<br>也给自己留一点时间。</blockquote><p>像一次没有预设路线的散步，我们不必立刻把每一种感受解释清楚。先注意到它，再让它慢慢展开。</p><p>合上书时，也许我们比刚才更愿意听一听自己的声音。</p><button class="action" data-action="reflect" style="width:100%;margin-top:27px">${icon('pen')}留下想法</button></div>`}
function thoughts(){return `<div class="screen-page">${header('想法')}<div class="demo-tab-body">${state.reflections.length?state.reflections.map(item=>`<article><small>${item.book.name} · 刚刚</small><h2>这次阅读留下的</h2><p>${escape(item.text)}</p></article>`).join(''):`<article><small>思考的形状 · 今天</small><h2>留白，是一种主动的选择</h2><p>给自己一点不急着得到答案的时间，也许本身就是思考的一部分。</p></article><article><small>漫步之间 · 昨天</small><h2>不带目的，也能有所发现</h2><p>并不是每一次出门，都要带着收获回来。</p></article>`}</div></div>`}
function mind(){return `<div class="screen-page">${header('我的')}<div class="demo-tab-body"><div class="thought-sample">读过的书，<br>正在成为你的一部分。</div><div class="mind-stats"><div><b>7</b><span>连续阅读 · 天</span></div><div><b>3</b><span>连续思考 · 天</span></div></div><article><small>正在形成的看法</small><h2>不急着填满，<br>才有空间发现。</h2></article><article><small>还在想的问题</small><h2>什么才是真正的休息？</h2></article></div></div>`}
function render(){device.dataset.variant=state.variant;device.dataset.page=state.page;screen.innerHTML=state.page==='reader'?reader():state.page==='thoughts'?thoughts():state.page==='mind'?mind():({'1':native,'2':directory,'3':focus}[state.variant])();renderTabs();renderSpec();renderSwitcher();document.documentElement.dataset.production=query.get('production')==='1'?'true':'false'}
function renderTabs(){document.getElementById('tabs').innerHTML=[['library','book','书架'],['thoughts','thought','想法'],['mind','person','我的']].map(([page,symbol,name])=>`<button class="tab ${state.page===page?'active':''}" data-action="${page}" aria-label="${name}" ${state.page===page?'aria-current="page"':''}>${icon(symbol)}<span>${name}</span></button>`).join('')}
function renderSpec(){const p=plans[state.variant];document.getElementById('spec').innerHTML=`<span class="spec-index">方案 ${state.variant} / 03</span><h2>${p.name}</h2><p class="spec-description">${p.description}</p><div class="spec-divider"></div><div class="type-spec">${['页面标题','当前书名','正文 / 操作','辅助信息'].map((name,i)=>`<div><span>${name}</span><b>${p.scale[i]}<small>px</small></b></div>`).join('')}</div><div class="spec-divider"></div><p class="spec-note">${p.spacing}</p><p class="spec-note" style="margin-top:15px">${p.tradeoff}</p><div class="spec-shortcuts">${Object.entries(plans).map(([key,item])=>`<button data-action="variant" data-value="${key}" class="${key===state.variant?'active':''}"><span>${key.padStart(2,'0')} ${item.name}</span>${icon('right')}</button>`).join('')}</div>`}
function renderSwitcher(){document.getElementById('switcher').innerHTML=`<button data-action="previous" aria-label="上一个方案">${icon('left')}</button><span class="switcher-label"><small>${state.variant} / 3</small>${plans[state.variant].name}</span><button data-action="next" aria-label="下一个方案">${icon('right')}</button>`}
function page(name){state.page=name;hide();render();screen.scrollTop=0}
function variant(name){state.variant=name;state.page='library';state.searchOpen=false;state.query='';try{const url=new URL(location.href);url.searchParams.set('variant',name);history.replaceState({},'',url)}catch(_){}hide();render();screen.scrollTop=0}
function toast(text){const node=document.getElementById('toast');node.textContent=text;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2100)}
function hide(){overlay.classList.remove('open');overlay.innerHTML=''}
function sheet(title,body){overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheet-header"><h2>${title}</h2><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div>${body}</section>`;overlay.classList.add('open')}
function act(name,el){switch(name){case'library':case'thoughts':case'mind':page(name);break;case'variant':variant(el.dataset.value);break;case'next':case'previous':variant(String((Number(state.variant)+(name==='next'?0:1))%3+1));break;case'read':state.active=books.find(b=>b.id===Number(el.dataset.book))||state.active;page('reader');break;case'search':state.searchOpen=!state.searchOpen;if(!state.searchOpen)state.query='';render();if(state.searchOpen)document.getElementById('search-input').focus({preventScroll:true});break;case'sort':state.sortByName=!state.sortByName;render();break;case'reflect':sheet('留下想法',`<p class="context">${state.active.name} · ${state.active.chapter}</p><textarea id="reflection-input" aria-label="写下读后想法" placeholder="这次阅读，让你想到了什么？">${escape(state.draft)}</textarea><button class="action" id="save-reflection" data-action="save" ${state.draft.trim()?'':'disabled'}>保存想法</button>`);break;case'save':if(state.draft.trim()){state.reflections.unshift({text:state.draft.trim(),book:{...state.active}});state.draft='';page('thoughts');toast('已加入本次演示')}break;case'close':hide();break;case'import':sheet('导入书籍',`<p class="context">本轮使用同一组演示书目比较版式。</p><button class="sheet-option" data-action="sample">查看演示书目 ${icon('right')}</button>`);break;case'sample':hide();state.query='';state.searchOpen=false;page('library');toast('4 本演示书籍');break;case'profile':sheet('设置',`<button class="sheet-option" data-action="identity">对话身份 ${icon('right')}</button><button class="sheet-option" data-action="privacy">数据与隐私 ${icon('right')}</button>`);break;case'identity':sheet('对话身份','<p class="context">你 · 页外<br>这一轮先比较字号和空间，身份编辑沿用后续正式设计。</p>');break;case'privacy':sheet('数据与隐私','<p class="context">此演示只保留内存状态，不读取书库或连接模型。刷新即重置。</p>');break}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)act(el.dataset.action,el);else if(e.target===overlay)hide()});
document.addEventListener('input',e=>{if(e.target.id==='reflection-input'){state.draft=e.target.value;document.getElementById('save-reflection').disabled=!state.draft.trim()}if(e.target.id==='search-input'){const position=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('search-input');input.focus({preventScroll:true});try{input.setSelectionRange(position,position)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hide();return}if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();act(e.key==='ArrowRight'?'next':'previous',{})}});
window.elsepageLayoutStudies={state,variant,page,render};render();
})();
</script>
</body>
</html>
