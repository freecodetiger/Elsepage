function bookCover(book,extra=''){return `<button class="cover-button ${extra}" data-action="read" data-book="${book.id}" aria-label="打开《${esc(book.title)}》"><div class="book-cover" style="--book:${book.color};--book-ink:${book.ink}"><div class="cover-inner"><span class="cover-kicker">${book.en}</span><h3 class="cover-title">${book.coverTitle}</h3><span class="cover-author">${book.author} 著</span><svg class="cover-art" viewBox="0 0 120 180" aria-hidden="true"><ellipse cx="65" cy="90" rx="35" ry="65"/><ellipse cx="65" cy="90" rx="25" ry="65"/><ellipse cx="65" cy="90" rx="14" ry="65"/><path d="M15 90h100M27 50h77M27 130h77"/></svg></div></div></button>`}

function readingActions(){return `<div class="actions"><button class="action" data-action="read" data-book="${state.book.id}">${icon('book')}继续阅读</button><button class="action secondary" data-action="reflect">${icon('pen')}补写想法</button></div>`}
function search(){return `<label class="searchbox">${icon('search')}<input id="book-search" type="search" value="${esc(state.query)}" placeholder="搜索书名或作者" aria-label="搜索书名或作者" autocomplete="off"></label>`}

function renderVariantA(){const list=visibleBooks();if(!list.length)return `<div class="page">${top()}${title('书架')}${search()}${empty()}</div>`;const active=state.book;return `<div class="page">${top()}${title('书架')}${search()}${state.query?gallery(list):`<section class="editorial-current">${bookCover(active,'large-cover')}<div class="current-info"><h2>${active.title}</h2><p class="author">${active.author} · ${active.chapter.split(' · ')[0]}</p>${progress(active)}</div></section>${readingActions()}<div class="section-heading"><h2>我的书架</h2><button class="tiny-button" data-action="sort">${icon('sort')}排序</button></div>${gallery(list.filter(b=>b.id!==active.id).slice(0,3))}`}</div>`}
function renderVariantB(){const list=visibleBooks();return `<div class="page">${top('YOUR READING SPACE')}${title('书架')}${search()}${!list.length?empty():`${!state.query?`<section class="plain-current">${bookCover(state.book,'large-cover')}<div class="current-info"><div class="current-label">继续上次阅读</div><h2>${state.book.title}</h2><p class="author">${state.book.author}</p><p class="chapter-label">${state.book.chapter}</p>${progress(state.book)}</div>${readingActions()}</section>`:''}<div class="section-heading"><h2>${state.query?'搜索结果':'全部书籍'} <span> / ${list.length}</span></h2><button class="tiny-button" data-action="sort">${icon('sort')}最近阅读</button></div>${list.map(b=>`<div class="flat-book">${bookCover(b)}<div class="flat-info"><h3>${b.title}</h3><p>${b.author} · ${b.progress?'已读 '+b.progress+'%':'尚未开始'}</p></div><button class="icon-button" data-action="read" data-book="${b.id}" aria-label="阅读${b.title}">${icon('right')}</button></div>`).join('')}`}</div>`}
function renderVariantC(){const list=visibleBooks();return `<div class="page">${top('A QUIET PLACE')}${state.empty?title('书架')+empty():`<h1 class="focus-intro">留一点时间，<br>给自己。</h1><section class="focus-current">${bookCover(state.book,'large-cover')}<h2>${state.book.title}</h2><p class="author">${state.book.author} · ${state.book.chapter.split(' · ')[0]}</p>${progress(state.book)}${readingActions()}</section><div class="section-heading"><h2>也在书架上</h2><button class="tiny-button" data-action="search-sheet" aria-label="搜索书籍">${icon('search')}</button></div><div class="focus-recent">${list.filter(b=>b.id!==state.book.id).map(b=>`<div class="focus-book">${bookCover(b)}<div><h3>${b.title}</h3><p>${b.author}</p></div></div>`).join('')}</div>`}</div>`}
function renderThoughts(){const records=state.grouping==='book'?[...state.records].sort((a,b)=>a.book.title.localeCompare(b.book.title,'zh-CN')):state.records;return `<div class="page">${top('THOUGHTS, OVER TIME')}${title('想法','thought-menu','想法分组')}<div class="thought-intro">${state.variant==='A'?'':'<small>留在页外的，是你自己的声音。</small>'}有些文字读过就忘了。<br>有些想法，会慢慢长大。</div><div class="section-heading"><h2>${state.grouping==='month'?'十一月':'阅读记录'}</h2><div class="thought-group-toggle"><button class="${state.grouping==='month'?'active':''}" data-action="group" data-value="month">按时间</button><button class="${state.grouping==='book'?'active':''}" data-action="group" data-value="book">按书籍</button></div></div>${records.map(r=>`<button class="thought-card" data-action="record" data-index="${state.records.indexOf(r)}"><span class="thought-meta"><b>${r.book.title}</b><span>${r.date}</span></span><h3>${r.title}</h3><p>${esc(r.text).slice(0,67)}${r.text.length>67?'…':''}</p><span class="thought-foot">${icon('thought')}打开这次阅读记录 ${icon('right')}</span></button>`).join('')}</div>`}
function renderMind(){return `<div class="page">${top('A LITTLE MORE YOU')}${title('我的','settings','打开设置')}<p class="mind-intro">读过的书，<br>正在成为你的一部分。</p><div class="streaks"><div class="streak"><strong>7<small>天</small></strong><span>连续阅读</span></div><div class="streak"><strong>3<small>天</small></strong><span>连续思考</span></div></div><div class="section-heading"><h2>正在形成的看法</h2><span>2 个</span></div><button class="mind-row" data-action="mind-detail" data-kind="thought"><span class="row-symbol">${icon('leaf')}</span><span class="mind-copy"><h3>关于注意力</h3><p>不急着填满，才有空间发现。</p><small>来自 2 次阅读中的想法</small></span>${icon('right')}</button><div class="section-heading"><h2>还在想的问题</h2><span>1 个</span></div><button class="mind-row" data-action="mind-detail" data-kind="question"><span class="row-symbol">${icon('question')}</span><span class="mind-copy"><p>如何区分真正的休息，<br>和暂时逃开？</p><small>正在探索</small></span>${icon('right')}</button><div class="section-heading"><h2>AI 记住的我</h2><span>由你确认与调整</span></div><button class="mind-row" data-action="mind-detail" data-kind="memory"><span class="row-symbol">${icon('person')}</span><span class="mind-copy"><p>你喜欢通过散步整理想法。</p><small>来自你的表达 · 演示记忆</small></span>${icon('right')}</button><div class="section-heading"><h2>阅读的印记</h2></div><button class="achievement" data-action="achievement" style="width:100%;background:transparent;text-align:left">${icon('badge')}<div><h3>给思考留个位置</h3><p>第一次把读后的想法留了下来。</p></div></button></div>`}
function renderReader(){return `<div class="reader-page"><div class="reader-nav"><button class="icon-button" data-action="library" aria-label="返回书架">${icon('left')}</button><span>${state.book.title}</span><button class="icon-button" data-action="appearance" aria-label="阅读外观">${icon('sun')}</button></div><h1 class="reader-title">${state.book.chapter}</h1><article class="reader-text" style="font-size:${state.fontSize}px"><p>我们习惯用完成了多少事情，来衡量一天是否值得。于是，连安静的片刻，也急着安排一个用途。</p><button class="passage" data-action="select" aria-label="选择这一段文字"><mark class="${state.highlight?'highlighted':''} ${state.selected?'selected':''}">有时候，思考并不发生在我们努力寻找答案的时候，而是在我们终于愿意留下一点空白的时候。</mark></button>${state.selected?`<div class="selection-bar"><button data-action="highlight">${icon('highlight')}${state.highlight?'取消划线':'划线'}</button><button data-action="note">${icon('pen')}笔记</button><button data-action="ask">${icon('spark')}问</button></div>`:''}<p>像一次没有预设路线的散步，我们不必立刻把每一种感受解释清楚。先注意到它，再让它慢慢展开。</p><p>重要的，也许不是在每一页都获得什么，而是合上书时，我们是否比刚才更愿意听一听自己的声音。</p></article><div class="reader-footer"><span>${state.variant==='A'?'演示节选':'演示节选 · 轻触中间段落可选中'}</span><span>${state.book.progress}%</span></div><div class="reader-controls"><button data-action="chapters">${icon('list')}目录</button><button data-action="annotations">${icon('note')}批注</button><button data-action="reflect">${icon('pen')}留下想法</button></div></div>`}
function renderRecord(){const r=state.records[state.activeRecord]||state.records[0];return `<div class="page"><div class="back-row"><button class="icon-button" data-action="thoughts" aria-label="返回想法">${icon('left')}</button><span>阅读记录</span><button class="icon-button" data-action="record-info" aria-label="关于这条记录">${icon('more')}</button></div><header class="record-header"><span class="eyebrow">${r.book.title} / ${r.date}</span><h2>${esc(r.title)}</h2>${state.variant==='A'?'':'<p>原话与回应，留在同一段阅读里。</p>'}</header><div class="message"><span class="message-label"><i class="avatar-dot">我</i>我的原话</span><p>${esc(r.text)}</p></div><div class="message ai"><span class="message-label"><i class="avatar-dot">${icon('spark')}</i>页外 · 演示回应</span><p>${esc(r.reply)}</p><button class="source-button" data-action="source">${icon('book')}原文 · ${r.book.chapter.split(' · ')[0]} ${icon('right')}</button></div>${(r.turns||[]).map(turn=>`<div class="message"><span class="message-label"><i class="avatar-dot">我</i>我的追问</span><p>${esc(turn.text)}</p></div>`).join('')}<div class="reply-field"><input id="reply-input" placeholder="继续说说你的想法…" aria-label="继续写想法" value="${esc(state.replyDraft)}"><button data-action="reply" aria-label="发送演示追问">${icon('send')}</button></div>${state.variant==='A'?'':'<p class="mock-note">这里呈现的是交互示例，未调用真实 AI。</p>'}</div>`}
function render(){phone.dataset.variant=state.variant;document.body.dataset.direction=state.variant;document.querySelector('.prototype-disclaimer').textContent=state.variant==='A'?'交互原型 · 演示数据，刷新重置。':'可交互视觉原型 · 所有书目、进度和 AI 文字均为演示数据；不连接真实模型，不读取书库。';content.innerHTML=state.page==='reader'?renderReader():state.page==='thoughts'?renderThoughts():state.page==='mind'?renderMind():state.page==='record'?renderRecord():({A:renderVariantA,B:renderVariantB,C:renderVariantC}[state.variant])();renderTabs();renderRail();renderSwitcher();document.documentElement.dataset.production=params.get('production')==='1'?'true':'false'}
function renderTabs(){document.getElementById('tabs').innerHTML=[['library','book','书架'],['thoughts','thought','想法'],['mind','person','我的']].map(([page,symbol,name])=>`<button class="tab-button ${state.page===page||(page==='thoughts'&&state.page==='record')?'active':''}" data-action="${page}" aria-label="${name}" ${state.page===page?'aria-current="page"':''}>${icon(symbol)}<span>${name}</span></button>`).join('')}
function renderRail(){const v=variants[state.variant];document.getElementById('design-rail').innerHTML=`<span class="rail-label">ELSEPAGE / EXPLORATION ${state.variant}</span><h1>${v.name}</h1><p class="rail-tagline">${v.tagline.replace('\n','<br>')}</p><div class="swatches">${v.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="rail-rule"></div>${v.notes.map(([h,p],i)=>`<div class="rail-item"><span class="rail-number">0${i+1}</span>${h}<p>${p}</p></div>`).join('')}<div class="rail-rule"></div><span class="rail-number">试一试</span><div class="scene-links"><button data-action="library">书架</button><button data-action="read" data-book="1">阅读</button><button data-action="thoughts">想法</button><button data-action="mind">我的</button><button data-action="reflect">写一段想法</button><button data-action="empty">${state.empty?'恢复演示书架':'空书架'}</button></div><p class="rail-state">当前：${v.name} / ${{library:'书架',reader:'阅读',thoughts:'想法',record:'阅读记录',mind:'我的'}[state.page]}<br>${state.empty?0:books.length} 本演示书籍 · ${state.records.length} 条演示记录<br>用于讨论视觉与交互，未接入 App。</p>`}
function renderSwitcher(){document.getElementById('variant-switcher').innerHTML=`<button data-action="variant-prev" aria-label="上一个视觉方向">${icon('left')}</button>${Object.entries(variants).map(([key,v])=>`<button class="variant-button" data-action="variant" data-value="${key}" aria-pressed="${key===state.variant}"><b>${key}</b>${v.name}</button>`).join('')}<button data-action="variant-next" aria-label="下一个视觉方向">${icon('right')}</button>`}
function setPage(page){state.page=page;state.selected=false;hideSheet();render();content.scrollTop=0}
function setVariant(v){state.variant=v;try{const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState({},'',url)}catch(e){}hideSheet();render()}
function notice(text){const node=document.getElementById('notice');clearTimeout(noticeTimer);node.innerHTML=icon('check')+esc(text);node.classList.add('show');noticeTimer=setTimeout(()=>node.classList.remove('show'),2300)}
function showSheet(title,html){layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-handle"></div><div class="sheet-heading"><h2>${title}</h2><button class="icon-button" data-action="dismiss" aria-label="关闭">${icon('close')}</button></div>${html}</section>`;layer.classList.add('open');const close=layer.querySelector('[data-action=dismiss]');close?.focus({preventScroll:true})}
function hideSheet(){layer.classList.remove('open');layer.innerHTML=''}
function row(symbol,label,action,detail=''){return `<button class="sheet-row" data-action="${action}">${icon(symbol)}<span>${label}</span>${detail?`<small>${detail}</small>`:''}${icon('right')}</button>`}
function showReflection(){showSheet('留下些什么',`<p class="subline">${state.book.title} · ${state.book.chapter}${state.variant==='A'?'':'<br>不必整理成答案，先留下此刻的想法。'}</p><textarea class="sheet-textarea" id="reflection-draft" aria-label="写下读后想法" placeholder="刚才读到的，有什么留在你心里？">${esc(state.reflectionDraft)}</textarea><div class="composer-tools"><button data-action="voice-info">${icon('mic')}用声音记录</button>${state.variant==='A'?'':'<span>保留你的原话</span>'}</div><div class="actions"><button class="action secondary" data-action="dismiss">稍后再写</button><button class="action" id="save-reflection" data-action="save-reflection" ${state.reflectionDraft.trim()?'':'disabled'}>保存想法 ${icon('arrow')}</button></div>`)}
function showSettings(){showSheet('设置',`<p class="subline">让阅读与思考，按你的方式发生。</p>${row('person','对话身份','identity','你与页外')}${row('spark','AI 模型','provider','演示状态')}${row('book','阅读外观','appearance')}${row('shield','数据与隐私','privacy','本地优先')}<div class="rule"></div><p class="mock-note">页外 Elsepage<br>这是一份独立视觉原型，不修改真实偏好或数据。</p>`)}
function handle(action,el){switch(action){case'library':case'thoughts':case'mind':setPage(action);break;case'variant':setVariant(el.dataset.value);break;case'variant-prev':case'variant-next':{const all=['A','B','C'];setVariant(all[(all.indexOf(state.variant)+(action==='variant-next'?1:2))%3]);break}case'read':{state.book=books.find(b=>b.id===Number(el.dataset.book))||state.book;setPage('reader');break}case'settings':showSettings();break;case'dismiss':hideSheet();break;case'reflect':showReflection();break;case'save-reflection':{const text=state.reflectionDraft.trim();if(!text)return;state.records.unshift({id:Date.now(),book:state.book,date:'刚刚',title:text.length>17?text.slice(0,17)+'…':text,text,reply:'先把这段原话留在这里，不急着整理成答案。等下一次读到相关的内容时，也许你会发现，自己已经有了新的理解。'});state.reflectionDraft='';state.activeRecord=0;setPage('record');notice('已加入本次演示的想法记录');break}case'record':state.activeRecord=Number(el.dataset.index);setPage('record');break;case'group':state.grouping=el.dataset.value;render();break;case'thought-menu':showSheet('整理想法',row('clock','按时间查看','group-month',state.grouping==='month'?'当前':'')+row('book','按书籍查看','group-book',state.grouping==='book'?'当前':''));break;case'group-month':case'group-book':state.grouping=action==='group-book'?'book':'month';hideSheet();render();break;case'sort':showSheet('书架排序',row('clock','最近阅读','sort-recent',state.sort==='recent'?'当前':'')+row('book','按书名','sort-title',state.sort==='title'?'当前':''));break;case'sort-recent':case'sort-title':state.sort=action==='sort-title'?'title':'recent';hideSheet();render();break;case'import':showSheet('把一本书带进来',`<p class="subline">正式 App 支持从“文件”导入 EPUB。<br>本原型使用演示书目，不读取你的文件。</p><div class="rule"></div>${row('plus','添加一本演示书籍','add-demo','仅本次原型')}`);break;case'add-demo':{if(!books.find(b=>b.id===5))books.push({id:5,title:'时间的褶皱',coverTitle:'时间的<br>褶皱',author:'顾微',en:'THE FOLDS OF TIME',color:'#c5c6d0',ink:'#555669',chapter:'第一章 · 此刻',progress:0});state.empty=false;state.query='';hideSheet();render();notice('演示书籍已加入书架');break}case'empty':state.empty=!state.empty;state.query='';setPage('library');break;case'search-sheet':showSheet('找一本书',books.map(b=>row('book',b.title,'read-'+b.id,b.author)).join(''));break;case'select':state.selected=!state.selected;render();break;case'highlight':state.highlight=!state.highlight;state.selected=false;render();notice(state.highlight?'已在演示中划线':'已取消演示划线');break;case'note':showSheet('记一句此刻的想法',`<div class="quote-box">思考，也发生在愿意留下一点空白的时候。</div><textarea id="note-draft" class="sheet-textarea" aria-label="笔记内容" placeholder="这句话，让你想到了什么？">${esc(state.note)}</textarea><div class="actions"><button class="action" data-action="save-note">完成 ${icon('check')}</button></div>`);break;case'save-note':state.note=layer.querySelector('#note-draft').value;state.selected=false;hideSheet();render();notice('笔记已保留在本次演示中');break;case'ask':showSheet('问一问页外',`<div class="quote-box">有时候，思考并不发生在我们努力寻找答案的时候。</div><div class="message-label">${icon('spark')}演示回应</div><p style="font-family:var(--serif);font-size:16px;line-height:2;margin-top:15px">这段演示文字把“思考”从用力寻找答案，转向给注意力留出空间。它邀请你先观察感受，而不是立即得出结论。</p><button class="source-button" data-action="source">${icon('book')}原文 · 第四章 ${icon('right')}</button><div class="actions"><button class="action secondary" data-action="save-ai-note">存为笔记</button><button class="action" data-action="dismiss">继续阅读</button></div><p class="mock-note">仅展示回应与引用交互，未发出模型请求。</p>`);break;case'save-ai-note':state.note='演示问答笔记：先观察感受，给注意力留出空间。';hideSheet();notice('演示回应已存为笔记');break;case'source':{if(state.page==='record')state.book=state.records[state.activeRecord].book;state.selected=true;state.page='reader';hideSheet();render();content.scrollTop=70;notice('已回到演示原文');break}case'chapters':showSheet('目录',['第一章 · 注意到自己','第二章 · 另一种步调','第三章 · 缓慢的力量','第四章 · 留白的意义'].map((c,i)=>`<button class="sheet-row" data-action="chapter" data-chapter="${c}"><span>${c}</span><small>${i===3?'正在阅读':''}</small>${icon('right')}</button>`).join(''));break;case'chapter':state.book={...state.book,chapter:el.dataset.chapter};hideSheet();render();content.scrollTop=0;break;case'annotations':showSheet('这本书的批注',`${state.highlight?`<div class="quote-box">有时候，思考并不发生在我们努力寻找答案的时候。</div>`:'<p class="subline">还没有划线。轻触正文中的中间段落试一试。</p>'}${state.note?`<div class="rule"></div><p style="font-size:14px;line-height:1.9;white-space:pre-wrap">${esc(state.note)}</p><button class="source-button" data-action="note">编辑笔记</button>`:'<p class="mock-note">笔记与划线分别保留。</p>'}`);break;case'appearance':showSheet('阅读外观',`<p class="subline">选一种让眼睛舒服的底色。</p><div class="theme-options"><button class="paper-option" data-action="reader-theme" data-value="paper" aria-pressed="${state.readerTheme==='paper'}">纸</button><button class="white-option" data-action="reader-theme" data-value="white" aria-pressed="${state.readerTheme==='white'}">白</button><button class="night-option" data-action="reader-theme" data-value="night" aria-pressed="${state.readerTheme==='night'}">夜</button></div><label class="appearance-row">正文字号 <input type="range" id="font-range" min="15" max="21" value="${state.fontSize}" aria-label="正文字号"></label><p class="mock-note">这是阅读外观样式探索，不是现有主题的完整清单。</p>`);break;case'reader-theme':state.readerTheme=el.dataset.value;phone.classList.remove('reader-paper','reader-white','reader-night');phone.classList.add('reader-'+state.readerTheme);layer.querySelectorAll('.theme-options button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;case'identity':showSheet('对话身份',`<div class="message"><span class="message-label"><i class="avatar-dot">我</i>你</span><p>保留自己的原话，不必写得完美。</p></div><div class="message ai"><span class="message-label"><i class="avatar-dot">${icon('spark')}</i>页外</span><p>克制地回应，陪你再想一步。</p></div><p class="mock-note">身份预览；姓名与头像编辑不在这份原型中展开。</p>`);break;case'provider':showSheet('AI 模型',`<p class="subline">真实产品使用你选择的 Provider 与 API Key。<br>原型不接受密钥，也不会连接任何模型。</p><div class="rule"></div><div class="sheet-row"><span>聊天模型</span><small>演示 · 未连接</small></div><div class="sheet-row"><span>语义检索</span><small>演示 · 未启用</small></div><p class="mock-note">不配置 AI，也可以阅读、划线和留下原话。</p>`);break;case'privacy':showSheet('数据与隐私',`<div class="quote-box">想法属于你。<br>让它们留在你掌握的地方。</div>${row('download','预览演示内容导出','demo-export')}${row('shield','关于本次原型','prototype-info')}<p class="mock-note">本原型不提供真实数据清除操作。</p>`);break;case'demo-export':showSheet('演示内容导出预览',`<p class="subline">仅预览内存中的演示记录。</p><div class="export-content">${esc(state.records.map(r=>r.book.title+'\n'+r.text).join('\n\n'))}</div>`);break;case'prototype-info':showSheet('关于这份原型','<p class="subline">用来选择视觉和交互方向。<br>全部数据只存在于本次打开的页面中；刷新即重置。它不是已实现功能的验收证明。</p>');break;case'mind-detail':{const kind=el.dataset.kind;const titles={thought:'关于注意力',question:'还在想的问题',memory:'AI 记住的我'};const copy={thought:'不急着填满，才有空间发现。',question:'如何区分真正的休息，和暂时逃开？',memory:'你喜欢通过散步整理想法。'};showSheet(titles[kind],`<div class="quote-box">${copy[kind]}</div><p class="subline">${kind==='memory'?'来源性质：来自你的表达；尚未经过真实模型提取。':'这是用于观察详情排版的演示条目。'}</p><div class="rule"></div>${row('book','查看演示来源','mind-source','漫步之间')}`);break}case'mind-source':state.activeRecord=1;setPage('record');break;case'achievement':showSheet('给思考留个位置',`<div class="empty-state" style="min-height:220px">${icon('badge')}<h2>从第一段原话开始</h2><p>把读后的想法留下来，<br>就是这枚演示徽章的意义。</p></div>`);break;case'voice-info':showSheet('用声音记录','<p class="subline">正式 App 已有录音与转写能力。<br>这份浏览器原型只展示入口，不申请麦克风权限。</p>');break;case'record-info':showSheet('关于这条记录','<p class="subline">你的原话与 AI 派生回应分别保留。<br>这里的示例不接真实存储、模型或删除操作。</p>');break;case'reply':{if(!state.replyDraft.trim())return;(state.records[state.activeRecord].turns??=[]).push({text:state.replyDraft.trim()});state.replyDraft='';render();notice('演示追问已加入对话');break}default:if(action.startsWith('read-')){state.book=books.find(b=>b.id===Number(action.slice(5)))||state.book;setPage('reader')}}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button&&!button.disabled)handle(button.dataset.action,button);else if(e.target===layer)hideSheet()});
document.addEventListener('input',e=>{if(e.target.id==='book-search'){const position=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('book-search');input.focus({preventScroll:true});try{input.setSelectionRange(position,position)}catch(_){} }if(e.target.id==='reflection-draft'){state.reflectionDraft=e.target.value;document.getElementById('save-reflection').disabled=!state.reflectionDraft.trim()}if(e.target.id==='reply-input')state.replyDraft=e.target.value;if(e.target.id==='font-range'){state.fontSize=Number(e.target.value);const article=content.querySelector('.reader-text');if(article)article.style.fontSize=state.fontSize+'px'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSheet();return}if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();handle(e.key==='ArrowRight'?'variant-next':'variant-prev',{})}});
window.elsepagePrototype={state,render,setPage,setVariant,showReflection,version:'0.2-throwaway'};
render();
})();
</script>
</body>
