<!doctype html>
<!-- THROWAWAY: native-first screens for 想法 / 我的 / 阅读. Static, no JS.
     System text sizes are CSS references, not Dynamic Type validation. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页外 · 其他页面原生收敛</title>
<style>
:root{
  --bg:#f2f2f2;
  --label:#111111;
  --secondary:#666666;
  --tertiary:#6e6e6e;
  --separator:#d4d4d4;
  --fill:rgba(118,118,128,.12);
  --surface:#ffffff;
  --radius:12px;
  --hairline:#e6e6e8;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f5f5f3;color:var(--label);font-family:var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}

.page-head{max-width:876px;margin:0 auto;padding:44px 24px 0}
.page-head h1{font-size:20px;font-weight:600;line-height:28px}
.page-head p{font-size:13px;line-height:20px;color:var(--secondary);margin-top:4px}

.study{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start;padding:28px 24px 8px}
.frame{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.frame figcaption{font-size:13px;line-height:18px;color:var(--secondary);text-align:center;max-width:360px}

.phone{
  position:relative;width:393px;height:852px;flex:none;display:flex;flex-direction:column;
  border-radius:54px;overflow:hidden;background:var(--bg);color:var(--label);
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.05),0 32px 64px -24px rgba(0,0,0,.28);
}

.status{position:relative;height:59px;flex:none;padding:17px 30px 0 31px;display:flex;justify-content:space-between;align-items:flex-start}
.time{font-size:17px;font-weight:600;line-height:21px}
.status-icons{display:block;height:13px;margin-top:2px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:19px;background:#000}

.nav{flex:none}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.nav-actions{display:flex;align-items:center}
.nav-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--label)}
.nav-btn svg,.tab svg,.search svg,.row-chevron svg,.reader-icon svg,.end-reading svg,.badge svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.large-title{padding:0 16px;height:52px;display:flex;align-items:center;font-size:34px;font-weight:700;line-height:41px}

.search{margin:0 16px 12px;height:36px;border-radius:10px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--secondary)}
.search span{font-size:17px;line-height:22px}

.content{flex:1;overflow:auto;scrollbar-width:none;padding:0 0 107px}
.content::-webkit-scrollbar{display:none}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 16px 4px}
.section-head--first{margin-top:8px}
.section-head h2{font-size:20px;font-weight:600;line-height:25px}
.section-head span{font-size:13px;line-height:18px;color:var(--secondary);font-variant-numeric:tabular-nums}

.entry{padding:14px 16px 16px;border-bottom:1px solid var(--separator)}
.entry:last-child{border-bottom:0}
.entry .meta{font-size:13px;line-height:18px;color:var(--secondary)}
.entry .meta b{font-weight:600;color:var(--label)}
.entry .summary{font-size:17px;font-weight:600;line-height:24px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 我的 · 分段 + 分组 */
.segmented{display:flex;margin:0 16px 16px;padding:2px;background:rgba(118,118,128,.12);border-radius:9px}
.segmented span{flex:1;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;line-height:18px;color:var(--label)}
.segmented .selected{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.group{margin:0 16px;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.row{position:relative;padding:16px;border-bottom:1px solid var(--hairline)}
.row:last-child{border-bottom:0}
.row h3{font-size:17px;font-weight:600;line-height:24px;padding-right:20px}
.row .preview{font-size:15px;line-height:22px;color:var(--secondary);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{font-size:13px;line-height:18px;color:var(--tertiary);margin-top:6px}
.row-chevron{position:absolute;right:16px;top:18px;color:var(--tertiary)}
.row-chevron svg{width:14px;height:14px;stroke-width:2}

.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:2;height:83px;padding:6px 22px 0;display:flex;justify-content:space-between;background:rgba(249,249,249,.88);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--separator)}
.tab{width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tertiary);font-size:10px;font-weight:500;line-height:12px}
.tab svg{width:25px;height:25px;stroke-width:1.7}
.tab.active{color:var(--label)}
.tab.active svg{stroke-width:1.9}
.home{position:absolute;z-index:3;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000}

/* 阅读 */
.phone--reader{background:#fff}
.reader-top{flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 4px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--separator)}
.reader-icon{width:44px;height:44px;display:grid;place-items:center;color:var(--label);flex:none}
.reader-icon svg{width:19px;height:19px}
.reader-icon .aa{font-size:17px;font-weight:600;line-height:20px}
.reader-titles{flex:1;min-width:0;padding:0 4px}
.reader-titles .t{font-size:17px;font-weight:600;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-titles .c{font-size:13px;line-height:18px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.reader-page{flex:1;min-height:0;padding:24px;font-family:var(--serif);overflow:hidden}
.reader-page .chapter-label{font-family:var(--sans);font-size:13px;font-weight:600;line-height:18px;color:var(--secondary);margin-top:0}
.reader-page .chapter-title{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.35;margin-top:6px}
.reader-page p{font-size:20px;line-height:1.85;margin-top:24px;text-align:justify}
.reader-page .quote{margin:24px 8px 0 16px;padding-left:16px;border-left:2px solid var(--separator);font-size:18px;line-height:1.8}
.hl{background:rgba(255,214,10,.32);border-radius:2px;padding:0 1px}

.reader-bottom{flex:none;padding-bottom:34px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--separator)}
.progress-line{height:2px;background:rgba(120,120,128,.16)}
.progress-line span{display:block;height:100%;width:62%;background:var(--label)}
.reader-actions{height:56px;display:flex;align-items:center;padding:0 4px}
.reader-actions .spacer{flex:1}
.reader-actions .percent{font-size:13px;line-height:18px;color:var(--secondary);font-variant-numeric:tabular-nums;padding:0 10px}
.end-reading{height:44px;padding:0 8px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;font-family:var(--sans);color:var(--label)}
.end-reading svg{width:19px;height:19px}

.note{max-width:876px;margin:0 auto;padding:14px 24px 40px;font-size:13px;line-height:20px;color:var(--secondary)}
.note b{font-weight:600;color:var(--label)}

@media (max-width:880px){
  .page-head{padding-top:28px}
  .study{gap:28px;padding-left:12px;padding-right:12px}
}
@media (max-width:430px){
  .page-head{padding:24px 20px 0}
  .study{padding:20px 0 0}
  .phone{zoom:.88}
  .note{padding-left:20px;padding-right:20px}
}
@media (max-width:350px){
  .phone{zoom:.78}
}
</style>
</head>

        <p class="quote">给思考留出空间，也给自己留一点时间。</p>
